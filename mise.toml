# Toolchain pin, plus the one setup task. `mise` here is for getting a matching SDK and for
# running `setup-repo`; it is not required — the script is plain bash and the README spells
# out the dotnet commands underneath it — but the SDK VERSION is: `global.json` asks for 10.0.100,
# because Roslyn 5.3.0's analyzers reference compiler 4.12.0.0 and SDK 8 ships 4.11.0.0
# (`CS9057`). SDK 10 builds this; SDK 8 cannot.
#
# The second pin is therefore for a RUNTIME, never for building. Both projects target net8.0,
# but only src/Cosy.Mcp sets RollForward=LatestMajor; the test project's runtimeconfig carries
# no rollForward, so it takes the default `Minor`, which does not cross a major version — on a
# host with only .NET 10 the test host will not start. Installing SDK 8 is simply the
# verified way to get its runtime and the net8.0 targeting pack onto the machine.
[tools]
dotnet = ["10.0.202", "8.0.420"]
node = "22"

[tasks.setup-repo]
description = "Install or update Cosy in a C# repository: `mise run setup-repo -- ~/work/my-api`. Add --tracing to switch on local trace collection; --dry-run to see the plan; --help for the flags"
# Bash rather than a task-runner script so it also works from Git Bash on Windows, where the
# only other prerequisite is the .NET SDK. The one step that needs a JSON implementation --
# the settings.json edit behind --tracing -- is delegated to `cosy-mcp settings
# set-trace-path`, a subcommand of the binary this script installs two steps earlier.
run = "bash scripts/setup-repo.sh"

[tasks.pack]
description = "Build the NuGet package into artifacts/nupkg/ — setup-repo does this for you when the package is missing"
run = "dotnet pack src/Cosy.Mcp/Cosy.Mcp.csproj -c Release"
