# Toolchain pin only. The build and install recipes live in the `justfile` — one runner,
# not two saying the same thing in different syntax. `mise` here is for getting a matching
# SDK; `just` is for doing something with it. Neither is required: the README spells out
# the plain dotnet commands, and `global.json` already asks for "SDK 8 or newer".
[tools]
dotnet = "10.0.202"
node = "22"
